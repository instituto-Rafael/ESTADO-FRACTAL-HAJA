name: Reproducible HAJA Governance Core Receipt

on:
  push:
    branches:
      - main
      - audit/reproducible-governance-core-v1-20260826
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-governance-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce governance contract + falsifiers
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    env:
      REPRO_CONTAINER_IMAGE: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
      REPRO_CHECKOUT_SHA: 11d5960a326750d5838078e36cf38b85af677262
      REPRO_UPLOAD_ARTIFACT_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

    steps:
      - name: Checkout immutable action revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compile governance validator, tests and receipt
        id: compile
        shell: sh
        run: |
          set -eu
          python3 -m py_compile \
            scripts/validate_legal_governance.py \
            tests/test_legal_governance.py \
            scripts/write_governance_repro_receipt.py

      - name: Validate canonical governance contract
        id: contract
        shell: sh
        run: |
          set -eu
          mkdir -p artifacts/reproducibility
          python3 scripts/validate_legal_governance.py \
            --contract data/contracts/haja_legal_governance.v1.json \
            --write-report artifacts/reproducibility/governance-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/reproducibility/governance-report.json').read_text())
          assert report['status'] == 'PASS'
          assert report['gate_count'] == 20
          assert report['claim_allowed'] is False
          print('PASS governance_contract gate_count=20 claim_allowed=false')
          PY

      - name: Run positive and negative governance falsifiers
        id: tests
        shell: sh
        run: |
          set -eu
          python3 -m unittest -v tests.test_legal_governance 2>&1 | tee artifacts/reproducibility/unittest.out

      - name: Emit machine-readable governance receipt
        id: receipt
        if: ${{ always() }}
        shell: sh
        env:
          GATE_COMPILE: ${{ steps.compile.outcome }}
          GATE_CONTRACT: ${{ steps.contract.outcome }}
          GATE_TESTS: ${{ steps.tests.outcome }}
        run: |
          set -eu
          test -f artifacts/reproducibility/governance-report.json
          test -f artifacts/reproducibility/unittest.out
          python3 scripts/write_governance_repro_receipt.py
          python3 -m json.tool artifacts/reproducibility/haja-governance-core-receipt.json >/dev/null
          sha256sum artifacts/reproducibility/haja-governance-core-receipt.json > artifacts/reproducibility/haja-governance-core-receipt.json.sha256

      - name: Upload HEAD-bound governance evidence
        id: upload
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haja-governance-core-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/reproducibility/haja-governance-core-receipt.json
            artifacts/reproducibility/haja-governance-core-receipt.json.sha256
            artifacts/reproducibility/governance-report.json
            artifacts/reproducibility/unittest.out
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Bind artifact digest to run summary
        if: ${{ always() && steps.upload.outcome == 'success' }}
        shell: sh
        run: |
          {
            echo "### HAJA governance reproducibility receipt"
            echo "- head: \`${GITHUB_SHA}\`"
            echo "- run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
            echo "- claim allowed: \`false\`"
            echo "- legal certification: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
